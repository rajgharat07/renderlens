[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renderlens"
version = "0.1.0"
description = "Screenshot-first accessibility auditor: Gemma 4 sees the render, WCAG math verifies contrast."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raj Gharat" }]
keywords = ["accessibility", "a11y", "wcag", "gemma", "gemini", "multimodal"]
dependencies = [
  "google-genai>=1.0.0",
  "Pillow>=10.0.0",
  "pydantic>=2.0.0",
  "typer>=0.12.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
renderlens = "renderlens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
